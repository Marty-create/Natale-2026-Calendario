<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impacchetta il regalo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0e1a;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            max-width: 450px;
            width: 100%;
            background: linear-gradient(145deg, #1a1f35, #0d1225);
            padding: 25px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            text-align: center;
        }

        h1 {
            color: #ffd200;
            font-size: 1.2em;
            margin-bottom: 3px;
        }

        .sottotitolo {
            color: #aab;
            font-size: 0.85em;
            margin-bottom: 15px;
        }

        .pacco {
            width: 150px;
            height: 150px;
            margin: 10px auto;
            background: linear-gradient(135deg, #8B8B8B, #6B6B6B);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            transition: all 0.5s;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: relative;
        }

            .pacco.incartato {
                background: linear-gradient(135deg, #ff6b6b, #ee5a24);
                transform: scale(1.05);
                box-shadow: 0 10px 50px rgba(238, 90, 36, 0.4);
            }

                .pacco.incartato::after {
                    content: '🎀';
                    position: absolute;
                    top: -15px;
                    right: -10px;
                    font-size: 2em;
                }

        .carte {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .carta-scelta {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            border: 3px solid #2a3050;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            background: #12182b;
        }

            .carta-scelta:hover:not(.usata) {
                transform: scale(1.08);
                border-color: #f7971e;
            }

            .carta-scelta.usata {
                opacity: 0.3;
                cursor: not-allowed;
                transform: scale(0.9);
            }

            .carta-scelta .colore {
                width: 40px;
                height: 40px;
                border-radius: 8px;
            }

        .stato {
            color: #4ecdc4;
            font-size: 1em;
            margin-top: 10px;
            min-height: 2em;
        }

        .btn {
            margin-top: 12px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1f35;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9em;
            transition: transform 0.2s;
        }

            .btn:hover {
                transform: scale(1.03);
            }

            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none;
            }

        .vittoria {
            color: #ffd200;
            font-size: 1.2em;
            margin-top: 10px;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @media (max-width: 480px) {
            .pacco {
                width: 120px;
                height: 120px;
                font-size: 2.5em;
            }

            .carta-scelta {
                width: 60px;
                height: 60px;
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎁 Impacchetta il regalo!</h1>
        <div class="sottotitolo">Scegli la carta giusta per incartare il pacco</div>

        <div class="pacco" id="pacco">📦</div>
        <div class="stato" id="stato">Scegli una carta!</div>

        <div class="carte" id="carte">
            <!-- generate da JS -->
        </div>

        <button class="btn" id="btnReset">🔄 Ricomincia</button>
        <div class="vittoria" id="vittoria"></div>
    </div>

    <script>
        const colori = [
            { nome: 'Rosso', colore: '#ee5a24', emoji: '🔴' },
            { nome: 'Oro', colore: '#f9ca24', emoji: '⭐' },
            { nome: 'Blu', colore: '#0984e3', emoji: '🔵' },
            { nome: 'Verde', colore: '#00b894', emoji: '🟢' }
        ];

        let cartaCorretta = null;
        let carteUsate = [];
        let completato = false;

        function scegliCartaCasuale() {
            return Math.floor(Math.random() * colori.length);
        }

        function avviaGioco() {
            cartaCorretta = scegliCartaCasuale();
            carteUsate = [];
            completato = false;
            document.getElementById('vittoria').textContent = '';
            document.getElementById('stato').textContent = 'Scegli la carta giusta!';
            document.getElementById('pacco').className = 'pacco';
            document.getElementById('pacco').textContent = '📦';
            document.getElementById('btnReset').disabled = false;
            renderizzaCarte();
        }

        function renderizzaCarte() {
            const container = document.getElementById('carte');
            container.innerHTML = '';
            colori.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = 'carta-scelta';
                if (carteUsate.includes(i)) {
                    div.classList.add('usata');
                }
                div.innerHTML = `<div class="colore" style="background:${c.colore};"></div>`;
                div.addEventListener('click', () => cliccaCarta(i));
                container.appendChild(div);
            });
        }

        function cliccaCarta(index) {
            if (completato) return;
            if (carteUsate.includes(index)) return;

            carteUsate.push(index);

            if (index === cartaCorretta) {
                // Vinto!
                completato = true;
                document.getElementById('pacco').className = 'pacco incartato';
                document.getElementById('pacco').textContent = '🎁';
                document.getElementById('stato').textContent = '🎉 Perfetto! Hai incartato il regalo! 🎉';
                document.getElementById('vittoria').textContent = '🎄 Buon Natale! 🎄';
                document.getElementById('btnReset').disabled = false;
                renderizzaCarte();
            } else {
                document.getElementById('stato').textContent = `❌ ${colori[index].nome} non è giusta. Riprova!`;
                renderizzaCarte();
                // Controlla se ha finito le carte
                if (carteUsate.length >= colori.length) {
                    document.getElementById('stato').textContent = `😅 Hai finito le carte! La carta giusta era ${colori[cartaCorretta].nome}.`;
                    document.getElementById('btnReset').disabled = false;
                }
            }
        }

        document.getElementById('btnReset').addEventListener('click', avviaGioco);

        // Avvia
        avviaGioco();
    </script>
</body>
</html>
