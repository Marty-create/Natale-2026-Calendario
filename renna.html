<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trova la renna</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0e1a;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #ffd200; font-size: 1.2em; margin-bottom: 5px; text-align: center; }
        .info { color: #aab; font-size: 0.85em; display: flex; gap: 25px; margin-bottom: 8px; }
        .info span { font-weight: bold; color: #fff; }
        #container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 50vh;
            max-height: 400px;
            background: linear-gradient(180deg, #0d1225, #1a1f35);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: hidden;
        }
        #renna {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #A0522D, #5D2E0C);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            box-shadow: 0 8px 30px rgba(139, 69, 19, 0.4);
            transition: transform 0.1s;
            will-change: transform, left, top;
            display: none;
        }
        #renna:active { transform: scale(0.9); }
        #renna.visibile { display: flex; }
        #renna.scomparsa { display: none; }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 14, 26, 0.85);
            z-index: 10;
            border-radius: 16px;
            transition: opacity 0.5s ease;
        }
        #overlay.nascosto {
            opacity: 0;
            pointer-events: none;
        }
        #overlay h2 { color: #ffd200; font-size: 1.5em; margin-bottom: 10px; }
        #overlay p { color: #aab; font-size: 0.9em; margin-bottom: 20px; text-align: center; padding: 0 20px; }
        #btnPlay {
            padding: 12px 40px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1f35;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #btnPlay:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(247,151,30,0.3); }

        #fine {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ffd200;
            font-size: 1.2em;
            display: none;
            background: rgba(10, 14, 26, 0.95);
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 300px;
            z-index: 20;
        }
        #fine .punti-finali { font-size: 2em; color: #4ecdc4; }
        #fine .sottotitolo { font-size: 0.6em; color: #889; margin-top: 8px; }
        .btn-rigioca {
            margin-top: 10px;
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1f35;
            font-weight: bold;
            font-size: 0.8em;
            cursor: pointer;
        }
        .btn-rigioca:hover { transform: scale(1.05); }

        @media (max-width: 480px) {
            #renna { width: 40px; height: 40px; font-size: 1.5em; }
            #container { height: 45vh; max-height: 350px; }
            h1 { font-size: 0.95em; }
            #overlay h2 { font-size: 1.2em; }
            #btnPlay { font-size: 1em; padding: 10px 30px; }
            #fine { font-size: 1em; padding: 15px; }
        }
    </style>
</head>
<body>
    <h1>🦌 Trova la renna!</h1>
    <div class="info">
        <div>⭐ Punti: <span id="punti">0</span></div>
        <div>⏱️ <span id="timer">30</span>s</div>
    </div>
    <div id="container">
        <!-- OVERLAY PLAY -->
        <div id="overlay">
            <h2>🎯 Pronto?</h2>
            <p>Clicca su "Inizia" e trova la renna il più velocemente possibile!<br>Hai 30 secondi ⏱️</p>
            <button id="btnPlay">▶ Inizia!</button>
        </div>

        <div id="renna">🦌</div>

        <div id="fine">
            <div>⏰ Tempo scaduto!</div>
            <div class="punti-finali" id="puntiFinali">0</div>
            <div style="font-size:0.7em; color:#aab;">punti</div>
            <button class="btn-rigioca" onclick="ricomincia()">🔄 Rigioca</button>
            <div class="sottotitolo">Ricarica la pagina per rigiocare</div>
        </div>
    </div>

    <script>
        const renna = document.getElementById('renna');
        const container = document.getElementById('container');
        const puntiSpan = document.getElementById('punti');
        const timerSpan = document.getElementById('timer');
        const fineDiv = document.getElementById('fine');
        const puntiFinali = document.getElementById('puntiFinali');
        const overlay = document.getElementById('overlay');
        const btnPlay = document.getElementById('btnPlay');

        let punti = 0;
        let tempo = 30;
        let giocoAttivo = false;
        let timerInterval = null;
        let spostaInterval = null;

        function spostaRenna() {
            if (!giocoAttivo) return;
            const rect = container.getBoundingClientRect();
            const size = window.innerWidth <= 480 ? 40 : 50;
            const maxX = Math.max(0, rect.width - size);
            const maxY = Math.max(0, rect.height - size);
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            renna.style.left = x + 'px';
            renna.style.top = y + 'px';
        }

        function clickRenna(e) {
            e.preventDefault();
            if (!giocoAttivo) return;
            punti++;
            puntiSpan.textContent = punti;
            spostaRenna();
        }

        function avviaGioco() {
            giocoAttivo = true;
            punti = 0;
            tempo = 30;
            puntiSpan.textContent = '0';
            timerSpan.textContent = '30';
            renna.classList.add('visibile');
            renna.classList.remove('scomparsa');
            fineDiv.style.display = 'none';
            overlay.classList.add('nascosto');

            if (timerInterval) clearInterval(timerInterval);
            if (spostaInterval) clearInterval(spostaInterval);

            spostaRenna();

            timerInterval = setInterval(() => {
                tempo--;
                timerSpan.textContent = tempo;
                if (tempo <= 0) {
                    clearInterval(timerInterval);
                    clearInterval(spostaInterval);
                    giocoAttivo = false;
                    renna.classList.remove('visibile');
                    renna.classList.add('scomparsa');
                    puntiFinali.textContent = punti;
                    fineDiv.style.display = 'block';
                }
            }, 1000);

            spostaInterval = setInterval(spostaRenna, 700);
        }

        function ricomincia() {
            avviaGioco();
        }

        // Eventi
        btnPlay.addEventListener('click', avviaGioco);
        renna.addEventListener('click', clickRenna);
        renna.addEventListener('touchstart', (e) => {
            e.preventDefault();
            clickRenna(e);
        });

        // Adatta la dimensione quando cambia la finestra
        window.addEventListener('resize', () => {
            if (giocoAttivo) spostaRenna();
        });
    </script>
</body>
</html>
